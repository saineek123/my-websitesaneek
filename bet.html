<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIG WIN - Sports Trading</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
  <style>
    /* ===== RESET ===== */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: #0a0a18;
      color: #e0e0e0;
      min-height: 100vh;
    }

    /* ===== SCROLLBAR ===== */
    ::-webkit-scrollbar {
      width: 4px;
    }
    ::-webkit-scrollbar-track {
      background: #0a0a18;
    }
    ::-webkit-scrollbar-thumb {
      background: #00e5ff;
      border-radius: 10px;
    }

    /* ===== HEADER ===== */
    header {
      background: #111125;
      padding: 10px 20px;
      position: sticky;
      top: 0;
      z-index: 100;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 1.2rem;
      font-weight: 800;
    }
    .logo i {
      color: #00e5ff;
      font-size: 1.3rem;
    }
    .logo span {
      background: linear-gradient(90deg, #00e5ff, #0077ff);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .header-right {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* ===== BALANCE - TRADING STYLE ===== */
    .balance-trading {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(0, 229, 255, 0.06);
      border: 1px solid rgba(0, 229, 255, 0.12);
      border-radius: 8px;
      padding: 6px 16px 6px 12px;
    }
    .balance-trading .label {
      font-size: 0.6rem;
      text-transform: uppercase;
      color: #888;
      letter-spacing: 0.5px;
    }
    .balance-trading .value {
      font-size: 1rem;
      font-weight: 700;
      color: #00e5ff;
    }
    .balance-trading .value .currency {
      font-size: 0.7rem;
      color: #888;
      margin-right: 2px;
    }

    .menu-icon {
      font-size: 1.3rem;
      cursor: pointer;
      color: #aaa;
      transition: 0.3s;
      padding: 4px;
    }
    .menu-icon:hover {
      color: #00e5ff;
    }

    /* ===== DRAWER ===== */
    .overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.7);
      z-index: 998;
      display: none;
    }

    .drawer {
      position: fixed;
      top: 0;
      left: -280px;
      width: 280px;
      height: 100%;
      background: #111125;
      padding: 20px 0;
      transition: 0.3s ease;
      z-index: 999;
      overflow-y: auto;
      border-right: 1px solid rgba(255, 255, 255, 0.05);
    }
    .drawer.open {
      left: 0;
    }

    .drawer-header {
      padding: 0 20px 20px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 10px;
    }
    .drawer .user-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .drawer .user-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: linear-gradient(135deg, #00e5ff, #0077ff);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      color: #000;
    }
    .drawer .user-name {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .drawer .user-id {
      font-size: 0.7rem;
      color: #666;
    }

    .drawer a {
      display: flex;
      align-items: center;
      gap: 14px;
      color: #bbb;
      text-decoration: none;
      font-weight: 500;
      padding: 12px 25px;
      margin: 2px 0;
      transition: 0.2s;
      font-size: 0.9rem;
      border-left: 3px solid transparent;
    }
    .drawer a i {
      width: 20px;
      text-align: center;
      font-size: 1rem;
    }
    .drawer a:hover {
      background: rgba(0, 229, 255, 0.06);
      color: #00e5ff;
      border-left-color: #00e5ff;
    }
    .drawer .divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.05);
      margin: 10px 20px;
    }

    /* ===== MAIN ===== */
    .main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 16px 16px 30px;
    }

    /* ===== TOP BAR ===== */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .top-bar .greeting {
      font-size: 1.1rem;
      font-weight: 600;
    }
    .top-bar .greeting span {
      color: #00e5ff;
    }
    .top-bar .actions {
      display: flex;
      gap: 8px;
    }
    .top-bar .actions button {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #ccc;
      padding: 6px 16px;
      border-radius: 6px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: 0.2s;
      font-weight: 500;
    }
    .top-bar .actions button:hover {
      background: rgba(0, 229, 255, 0.1);
      border-color: rgba(0, 229, 255, 0.2);
      color: #00e5ff;
    }

    /* ===== INVESTMENT BAR - UNLIMITED ===== */
    .invest-bar {
      background: linear-gradient(135deg, #1a1a3e, #0f3460);
      border-radius: 10px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      border: 1px solid rgba(0, 229, 255, 0.08);
    }
    .invest-bar .info {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .invest-bar .info i {
      color: #00e5ff;
      font-size: 1.1rem;
    }
    .invest-bar .info .text {
      font-size: 0.85rem;
    }
    .invest-bar .info .text strong {
      color: #00e5ff;
    }
    .invest-bar .info .text .sub {
      color: #888;
      font-size: 0.75rem;
    }
    .invest-bar .btn-invest {
      background: linear-gradient(90deg, #00e5ff, #0077ff);
      border: none;
      color: #000;
      padding: 8px 22px;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.3s;
    }
    .invest-bar .btn-invest:hover {
      transform: scale(1.03);
      box-shadow: 0 0 25px rgba(0, 229, 255, 0.25);
    }

    /* ===== MATCHES - TRADING STYLE ===== */
    .section-title {
      font-size: 1.1rem;
      font-weight: 700;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
      color: #00e5ff;
    }
    .section-title i {
      font-size: 1rem;
    }

    .matches-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 16px;
    }

    .match-card {
      background: #111125;
      border-radius: 10px;
      padding: 18px;
      border: 1px solid rgba(255, 255, 255, 0.06);
      transition: 0.3s;
    }
    .match-card:hover {
      border-color: rgba(0, 229, 255, 0.15);
      transform: translateY(-2px);
    }

    .match-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .match-header .teams {
      font-weight: 600;
      font-size: 0.95rem;
    }
    .match-header .status {
      font-size: 0.65rem;
      font-weight: 700;
      text-transform: uppercase;
      padding: 3px 10px;
      border-radius: 20px;
    }
    .status-live {
      background: rgba(255, 0, 0, 0.15);
      color: #ff5555;
      border: 1px solid rgba(255, 0, 0, 0.2);
      animation: pulse 1.5s infinite;
    }
    .status-upcoming {
      background: rgba(0, 229, 255, 0.1);
      color: #00e5ff;
      border: 1px solid rgba(0, 229, 255, 0.15);
    }
    .status-locked {
      background: rgba(255, 85, 85, 0.08);
      color: #ff5555;
      border: 1px solid rgba(255, 85, 85, 0.1);
    }

    .match-timer {
      font-size: 0.75rem;
      color: #666;
      margin-bottom: 12px;
      text-align: center;
    }
    .match-timer.locked {
      color: #ff5555;
    }

    .odds-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 12px 0;
    }
    .odds-btn {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px 12px;
      cursor: pointer;
      transition: 0.2s;
      text-align: center;
      color: #ccc;
    }
    .odds-btn:hover:not(.disabled) {
      background: rgba(0, 229, 255, 0.06);
      border-color: rgba(0, 229, 255, 0.2);
    }
    .odds-btn.selected {
      background: rgba(0, 229, 255, 0.1);
      border-color: #00e5ff;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.05);
    }
    .odds-btn .team {
      font-size: 0.85rem;
      font-weight: 500;
    }
    .odds-btn .rate {
      font-size: 0.9rem;
      font-weight: 700;
      color: #00e5ff;
      margin-top: 2px;
    }
    .odds-btn.disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }
    .odds-btn.disabled:hover {
      background: rgba(255, 255, 255, 0.04);
      border-color: rgba(255, 255, 255, 0.08);
    }

    .bet-row {
      display: flex;
      gap: 10px;
      margin: 12px 0;
      align-items: center;
    }
    .bet-row input {
      flex: 1;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 8px 12px;
      color: #fff;
      font-size: 0.85rem;
      outline: none;
      transition: 0.2s;
      min-width: 0;
    }
    .bet-row input:focus {
      border-color: rgba(0, 229, 255, 0.3);
      background: rgba(255, 255, 255, 0.07);
    }
    .bet-row input::placeholder {
      color: #555;
      font-size: 0.75rem;
    }
    .bet-row input:disabled {
      opacity: 0.3;
      cursor: not-allowed;
    }

    .payout-display {
      font-size: 0.75rem;
      color: #888;
      text-align: center;
      padding: 6px;
      border-radius: 6px;
      background: rgba(0, 229, 255, 0.04);
      border: 1px dashed rgba(0, 229, 255, 0.08);
      margin-bottom: 10px;
    }
    .payout-display .win {
      color: #00e5ff;
      font-weight: 600;
    }

    .bet-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-weight: 700;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.2s;
      background: linear-gradient(90deg, #00e5ff, #0077ff);
      color: #000;
    }
    .bet-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 20px rgba(0, 229, 255, 0.2);
    }
    .bet-btn:disabled {
      background: #2a2a3a;
      color: #666;
      cursor: not-allowed;
    }

    .selected-info {
      font-size: 0.75rem;
      color: #00e5ff;
      text-align: center;
      padding: 6px;
      margin-top: 8px;
      border-radius: 6px;
      background: rgba(0, 229, 255, 0.05);
    }

    .lock-msg {
      font-size: 0.75rem;
      color: #ff5555;
      text-align: center;
      padding: 6px;
      margin-top: 6px;
      border-radius: 6px;
      background: rgba(255, 85, 85, 0.06);
    }

    .no-matches {
      text-align: center;
      padding: 40px 20px;
      color: #666;
    }
    .no-matches i {
      font-size: 2.5rem;
      color: #333;
      margin-bottom: 12px;
    }

    /* ===== NOTIFICATION ===== */
    .notification {
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 20px;
      background: #1a1a3e;
      border-left: 3px solid #00e5ff;
      border-radius: 8px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
      transform: translateX(120%);
      transition: 0.4s ease;
      z-index: 1000;
      font-size: 0.85rem;
      font-weight: 500;
      max-width: 340px;
    }
    .notification.show {
      transform: translateX(0);
    }
    .notification.error {
      border-left-color: #ff5555;
    }

    /* ===== ANIMATIONS ===== */
    @keyframes pulse {
      0%,
      100% {
        opacity: 1;
      }
      50% {
        opacity: 0.5;
      }
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 768px) {
      header {
        flex-wrap: wrap;
        gap: 8px;
        padding: 8px 14px;
      }
      .logo {
        font-size: 1rem;
      }
      .balance-trading {
        padding: 4px 12px 4px 10px;
      }
      .balance-trading .label {
        font-size: 0.55rem;
      }
      .balance-trading .value {
        font-size: 0.85rem;
      }
      .top-bar {
        flex-direction: column;
        align-items: stretch;
        gap: 8px;
      }
      .top-bar .actions {
        justify-content: stretch;
      }
      .top-bar .actions button {
        flex: 1;
        text-align: center;
      }
      .matches-grid {
        grid-template-columns: 1fr;
      }
      .invest-bar {
        flex-direction: column;
        text-align: center;
        padding: 14px;
      }
      .invest-bar .info {
        justify-content: center;
      }
    }

    @media (max-width: 480px) {
      .match-card {
        padding: 14px;
      }
      .odds-btn {
        padding: 8px 10px;
      }
      .odds-btn .team {
        font-size: 0.75rem;
      }
      .odds-btn .rate {
        font-size: 0.8rem;
      }
      .bet-row {
        flex-wrap: wrap;
      }
      .bet-row input {
        min-width: 100px;
      }
    }
  </style>
</head>
<body>

  <!-- ===== OVERLAY ===== -->
  <div class="overlay" id="overlay" onclick="toggleDrawer()"></div>

  <!-- ===== DRAWER ===== -->
  <div class="drawer" id="drawer">
    <div class="drawer-header">
      <div class="user-info">
        <div class="user-avatar"><i class="fas fa-user"></i></div>
        <div>
          <div class="user-name" id="drawerName">User</div>
          <div class="user-id">ID: <span id="drawerId">---</span></div>
        </div>
      </div>
    </div>
    <a href="#"><i class="fas fa-home"></i> Home</a>
    <a href="#"><i class="fas fa-wallet"></i> Recharge</a>
    <a href="#"><i class="fas fa-money-bill-wave"></i> Withdraw</a>
    <a href="#"><i class="fas fa-history"></i> History</a>
    <a href="#"><i class="fas fa-user"></i> Account</a>
    <div class="divider"></div>
    <a href="#"><i class="fas fa-headset"></i> Support</a>
    <a href="#"><i class="fas fa-gift"></i> Invite</a>
    <a href="#"><i class="fas fa-cog"></i> Settings</a>
    <div class="divider"></div>
    <a href="#" style="color:#ff5555;" onclick="logout()"><i class="fas fa-sign-out-alt"></i> Logout</a>
  </div>

  <!-- ===== HEADER ===== -->
  <header>
    <div class="logo">
      <i class="fas fa-flag-checkered"></i>
      <span>BIG WIN</span>
    </div>
    <div class="header-right">
      <div class="balance-trading">
        <span class="label">Balance</span>
        <span class="value"><span class="currency">₹</span><span id="mainBalance">0.00</span></span>
      </div>
      <div class="menu-icon" onclick="toggleDrawer()">
        <i class="fas fa-bars"></i>
      </div>
    </div>
  </header>

  <!-- ===== MAIN ===== -->
  <div class="main">

    <!-- Top Bar -->
    <div class="top-bar">
      <div class="greeting">Welcome, <span id="userName">User</span>!</div>
      <div class="actions">
        <button onclick="window.location.href='recharge.html'"><i class="fas fa-plus"></i> Add Funds</button>
        <button onclick="window.location.href='withdraw.html'"><i class="fas fa-arrow-up"></i> Withdraw</button>
      </div>
    </div>

    <!-- Investment Bar - UNLIMITED INVESTMENTS -->
    <div class="invest-bar">
      <div class="info">
        <i class="fas fa-chart-line"></i>
        <div class="text">
          <strong>Investment Plan</strong> — Earn 10% daily for 24 hours
          <div class="sub">💡 Invest anytime, unlimited times</div>
        </div>
      </div>
      <button class="btn-invest" onclick="openInvestment()"><i class="fas fa-rocket"></i> Invest Now</button>
    </div>

    <!-- Live Betting -->
    <div class="section-title">
      <i class="fas fa-fire"></i> Live Trading
    </div>

    <div class="matches-grid" id="matchesContainer">
      <!-- Matches loaded via JS -->
    </div>

  </div>

  <!-- ===== NOTIFICATION ===== -->
  <div id="notification" class="notification"></div>

  <script>
    // ===== FIREBASE =====
    const firebaseConfig = {
      apiKey: "AIzaSyDTIIz6F0Dpxow48HiIyhn1qCISHcdubiQ",
      authDomain: "betting-app-43800.firebaseapp.com",
      databaseURL: "https://betting-app-43800-default-rtdb.firebaseio.com",
      projectId: "betting-app-43800"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // ===== STATE =====
    let userBalance = 0;
    let selectedBets = {};
    let allMatches = {};
    let userBets = {};
    let matchTimers = {};
    let currentUser = null;

    // ===== DRAWER =====
    function toggleDrawer() {
      const d = document.getElementById('drawer');
      const o = document.getElementById('overlay');
      d.classList.toggle('open');
      o.style.display = d.classList.contains('open') ? 'block' : 'none';
    }

    // ===== NOTIFICATION =====
    function notify(msg, isErr = false) {
      const n = document.getElementById('notification');
      n.textContent = msg;
      n.className = isErr ? 'notification error show' : 'notification show';
      clearTimeout(n._t);
      n._t = setTimeout(() => n.className = 'notification', 3000);
    }

    // ===== INVESTMENT - UNLIMITED =====
    function openInvestment() {
      const amount = prompt('Enter investment amount (₹):');
      if (!amount) return;
      const val = parseFloat(amount);
      if (isNaN(val) || val <= 0) return notify('Invalid amount', true);
      if (val > userBalance) return notify('Insufficient balance', true);

      const user = auth.currentUser;
      if (!user) return notify('Please login', true);

      // Deduct from wallet
      const newBal = userBalance - val;
      const investData = {
        amount: val,
        dailyReturn: val * 0.10,
        totalReturn: val * 0.10 * 24,
        startDate: Date.now(),
        endDate: Date.now() + (24 * 60 * 60 * 1000),
        active: true
      };

      db.ref(`users/${user.uid}/wallet/balance`).set(newBal);
      db.ref(`users/${user.uid}/investments`).push(investData).then(() => {
        userBalance = newBal;
        updateBalanceDisplay();
        notify(`✅ Investment of ₹${val} successful!`);
      }).catch(() => notify('Investment failed', true));
    }

    // ===== BALANCE =====
    function updateBalanceDisplay() {
      document.getElementById('mainBalance').textContent = userBalance.toFixed(2);
    }

    function fetchBalance() {
      const user = auth.currentUser;
      if (!user) return;
      db.ref(`users/${user.uid}/wallet/balance`).on('value', (snap) => {
        userBalance = snap.val() || 0;
        updateBalanceDisplay();
      });
    }

    // ===== MATCHES =====
    function fetchMatches() {
      db.ref('matches').on('value', (snap) => {
        allMatches = snap.val() || {};
        renderMatches();
        setupTimers();
      });
    }

    function fetchUserBets() {
      const user = auth.currentUser;
      if (!user) return;
      db.ref(`users/${user.uid}/bets`).on('value', (snap) => {
        userBets = snap.val() || {};
        renderMatches();
      });
    }

    function renderMatches() {
      const container = document.getElementById('matchesContainer');
      container.innerHTML = '';

      const ids = Object.keys(allMatches).filter(id => !allMatches[id].result);

      if (ids.length === 0) {
        container.innerHTML = `
          <div class="no-matches">
            <i class="fas fa-calendar-times"></i>
            <div>No matches available</div>
          </div>
        `;
        return;
      }

      ids.forEach(id => {
        const m = allMatches[id];
        const locked = m.status === 'locked' || m.locked;
        const live = m.status === 'live';
        const upcoming = m.status === 'upcoming';
        const hasBet = userBets && userBets[id];

        const card = document.createElement('div');
        card.className = 'match-card';
        card.innerHTML = `
          <div class="match-header">
            <div class="teams">${m.team1} vs ${m.team2}</div>
            <div class="status ${live ? 'status-live' : upcoming ? 'status-upcoming' : 'status-locked'}">
              ${live ? 'LIVE' : upcoming ? 'UPCOMING' : 'LOCKED'}
            </div>
          </div>
          <div class="match-timer ${locked ? 'locked' : ''}" id="timer-${id}">
            <i class="fas fa-clock"></i> ${m.timeRemaining || '00:00:00'}
          </div>

          <div class="odds-row">
            <div class="odds-btn ${locked || hasBet ? 'disabled' : ''}" id="btn-${id}-1"
              onclick="${!locked && !hasBet ? `selectTeam('${id}','${m.team1}',${m.rate1})` : ''}">
              <div class="team">${m.team1}</div>
              <div class="rate">${m.rate1}</div>
            </div>
            <div class="odds-btn ${locked || hasBet ? 'disabled' : ''}" id="btn-${id}-2"
              onclick="${!locked && !hasBet ? `selectTeam('${id}','${m.team2}',${m.rate2})` : ''}">
              <div class="team">${m.team2}</div>
              <div class="rate">${m.rate2}</div>
            </div>
          </div>

          <div class="bet-row">
            <input type="number" id="amount-${id}" placeholder="Amount" 
              ${locked || hasBet ? 'disabled' : ''} oninput="calcPayout('${id}')"/>
          </div>

          <div class="payout-display" id="payout-${id}">
            <i class="fas fa-calculator"></i> Potential: <span class="win">₹0.00</span>
          </div>

          <button class="bet-btn" onclick="placeBet('${id}')" ${locked || hasBet ? 'disabled' : ''}>
            ${hasBet ? '✅ Bet Placed' : locked ? '🔒 Locked' : 'Place Bet'}
          </button>

          <div class="selected-info" id="selected-${id}">
            ${hasBet ? `✅ ${userBets[id].team} @${userBets[id].rate} (₹${userBets[id].amount})` : '👆 Select a team'}
          </div>

          ${locked && !hasBet ? `<div class="lock-msg"><i class="fas fa-lock"></i> Betting closed</div>` : ''}
          ${hasBet ? `<div class="lock-msg"><i class="fas fa-check"></i> Already placed</div>` : ''}
        `;
        container.appendChild(card);

        if (selectedBets[id]) {
          const btnId = selectedBets[id].team === m.team1 ? '1' : '2';
          const el = document.getElementById(`btn-${id}-${btnId}`);
          if (el) el.classList.add('selected');
        }
      });
    }

    // ===== TIMERS =====
    function setupTimers() {
      Object.keys(matchTimers).forEach(id => clearInterval(matchTimers[id]));
      matchTimers = {};

      Object.keys(allMatches).forEach(id => {
        const m = allMatches[id];
        if (!m.startTime) return;
        const start = typeof m.startTime === 'number' ? m.startTime : m.startTime * 1000;

        matchTimers[id] = setInterval(() => {
          const now = Date.now();
          const left = start - now;
          if (left <= 0) {
            clearInterval(matchTimers[id]);
            db.ref(`matches/${id}/status`).set('live');
            setTimeout(() => db.ref(`matches/${id}/locked`).set(true), 300000);
            return;
          }
          const h = String(Math.floor(left / 3600000)).padStart(2, '0');
          const m = String(Math.floor((left % 3600000) / 60000)).padStart(2, '0');
          const s = String(Math.floor((left % 60000) / 1000)).padStart(2, '0');
          const el = document.getElementById(`timer-${id}`);
          if (el) el.innerHTML = `<i class="fas fa-clock"></i> ${h}:${m}:${s}`;
        }, 1000);
      });
    }

    // ===== SELECT TEAM =====
    function selectTeam(id, team, rate) {
      const m = allMatches[id];
      if (!m) return;

      document.getElementById(`btn-${id}-1`)?.classList.remove('selected');
      document.getElementById(`btn-${id}-2`)?.classList.remove('selected');

      const btnId = team === m.team1 ? '1' : '2';
      const el = document.getElementById(`btn-${id}-${btnId}`);
      if (el) el.classList.add('selected');

      selectedBets[id] = { team, rate };
      document.getElementById(`selected-${id}`).innerHTML = `✅ ${team} @${rate}`;
      calcPayout(id);
    }

    // ===== CALCULATE PAYOUT =====
    function calcPayout(id) {
      const inp = document.getElementById(`amount-${id}`);
      const out = document.getElementById(`payout-${id}`);
      const bet = selectedBets[id];
      if (!bet) { out.innerHTML = `<i class="fas fa-calculator"></i> Select a team first`; return; }
      const amt = parseFloat(inp.value);
      if (isNaN(amt) || amt <= 0) { out.innerHTML = `<i class="fas fa-calculator"></i> Enter valid amount`; return; }
      const win = amt * bet.rate;
      out.innerHTML = `<i class="fas fa-calculator"></i> Potential: <span class="win">₹${win.toFixed(2)}</span> (₹${amt} + ₹${(win - amt).toFixed(2)})`;
    }

    // ===== PLACE BET =====
    function placeBet(id) {
      const user = auth.currentUser;
      if (!user) return notify('Please login', true);

      const inp = document.getElementById(`amount-${id}`);
      const amt = parseFloat(inp.value);
      const bet = selectedBets[id];

      if (!bet) return notify('Select a team first', true);
      if (isNaN(amt) || amt <= 0) return notify('Enter valid amount', true);
      if (amt > userBalance) return notify('Insufficient balance', true);
      if (amt < 10) return notify('Minimum ₹10', true);

      const m = allMatches[id];
      const newBal = userBalance - amt;
      const betData = {
        matchId: id,
        match: `${m.team1} vs ${m.team2}`,
        team: bet.team,
        rate: bet.rate,
        amount: amt,
        return: 0,
        timestamp: Date.now(),
        result: 'pending'
      };

      db.ref(`users/${user.uid}/wallet/balance`).set(newBal);
      db.ref(`users/${user.uid}/bets/${id}`).set(betData).then(() => {
        userBalance = newBal;
        updateBalanceDisplay();
        userBets[id] = betData;
        delete selectedBets[id];
        notify(`✅ Bet placed on ${bet.team} for ₹${amt}`);
        renderMatches();
      }).catch(() => notify('Bet failed', true));
    }

    // ===== LOGOUT =====
    function logout() {
      auth.signOut().finally(() => {
        localStorage.clear();
        window.location.href = 'login.html';
      });
    }

    // ===== INIT =====
    function init() {
      auth.onAuthStateChanged(user => {
        if (user) {
          currentUser = user;
          db.ref(`users/${user.uid}/name`).once('value', snap => {
            const name = snap.val() || 'User';
            document.getElementById('userName').textContent = name;
            document.getElementById('drawerName').textContent = name;
          });
          db.ref(`users/${user.uid}/id`).once('value', snap => {
            document.getElementById('drawerId').textContent = snap.val() || user.uid.slice(0, 8);
          });
          fetchBalance();
          fetchMatches();
          fetchUserBets();
        } else {
          notify('Please login', true);
          setTimeout(() => window.location.href = 'login.html', 1500);
        }
      });
    }

    document.addEventListener('DOMContentLoaded', init);
  </script>

</body>
</html>
